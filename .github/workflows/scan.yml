name: Daily Market Scan

on:
  schedule:
    - cron: '0 5 * * 1-5'   # 7h00 Paris (UTC+2 été) — lundi au vendredi
  workflow_dispatch:           # permet de lancer manuellement depuis GitHub

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install yfinance pandas numpy groq playwright -q

      - name: Get Playwright version (pour la clé de cache)
        id: pw-version
        run: echo "version=$(pip show playwright | grep ^Version | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Cache Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Installer Chromium (premier run ou nouvelle version)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: Installer les dépendances système Chromium (cache présent)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Run market scan
        run: python market_scan.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: savelsmanu@gmail.com
          CC_EMAILS: ""
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
